# Entrenamiento completo (~99.3% test accuracy). Requiere GPU para ser rapido.
name: mnist_simplecnn_full
seed: 42
deterministic: true
device: auto
output_dir: runs
save_checkpoint: true
early_stopping_patience: 5
time_budget_seconds: 1800
log_every_n_steps: 100

data:
  root: data
  val_split: 0.1
  batch_size: 128
  num_workers: 2
  augment: true

model:
  name: simple_cnn
  params:
    width: 32
    dropout: 0.25
    head_hidden: 128

optim:
  name: adamw
  lr: 0.001
  weight_decay: 0.0001
  scheduler: onecycle
  max_epochs: 15
  pct_start: 0.3
  grad_clip: 5.0

wandb:
  enabled: true
  project: mnist-digit-classifier
  tags: [mnist, pytorch, cnn, full]
