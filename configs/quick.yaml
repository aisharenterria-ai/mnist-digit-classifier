# Baseline rapido para verificar la pipeline en pocos minutos (CPU).
name: mnist_quick
seed: 42
deterministic: true
device: auto
output_dir: runs
save_checkpoint: true
log_every_n_steps: 20

data:
  root: data
  val_split: 0.1
  batch_size: 256
  num_workers: 0
  augment: false

model:
  name: simple_cnn
  params:
    width: 16
    dropout: 0.2

optim:
  name: adamw
  lr: 0.001
  scheduler: onecycle
  max_epochs: 3
  grad_clip: 5.0

wandb:
  enabled: false
  project: mnist-digit-classifier
